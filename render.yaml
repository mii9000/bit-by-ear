services:
  - type: web
    name: bit-by-ear
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate:production && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bit-by-ear-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PROVIDER_MODE
        value: real
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-3-12b-it
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com

  - type: worker
    name: bit-by-ear-worker
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bit-by-ear-db
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          type: web
          name: bit-by-ear
          envVarKey: SESSION_SECRET
      - key: PROVIDER_MODE
        value: real
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-3-12b-it
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com

databases:
  - name: bit-by-ear-db
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: []
    region: frankfurt
    databaseName: bitbyear
    user: bitbyear
